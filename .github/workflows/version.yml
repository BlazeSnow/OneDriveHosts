name: Version

on:
  push:
    tags:
    - 'v*'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
    - name: Create Release
      uses: ncipollo/release-action@v1
      with:
        tag: ${{ github.ref_name }}
        body: https://github.com/BlazeSnow/OneDriveHosts/blob/main/CHANGELOG.md
